<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dubious</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" width="28" height="28" />
      <div>
        <h1>Dubious</h1>
        <p class="tag">Find claims that don't hold up.</p>
      </div>
    </header>

    <button id="scan" type="button">Scan this page</button>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <p id="links" class="links" hidden>
      <a id="report" href="#" target="_blank" rel="noopener">Open full report</a>
      <button id="clear" type="button" class="linkish">Clear underlines</button>
    </p>

    <section class="setting">
      <label for="threshold">Flag claims scoring <output id="thresholdOut" for="threshold">40</output>% or higher</label>
      <input id="threshold" type="range" min="20" max="80" step="5" value="40" />
    </section>

    <ul class="legend" aria-label="Underline colours">
      <li><span class="squiggle medium"></span>40–59 · questionable</li>
      <li><span class="squiggle high"></span>60–79 · dubious</li>
      <li><span class="squiggle severe"></span>80–100 · very dubious</li>
    </ul>

    <footer id="backend" class="backend"></footer>

    <script src="popup.js"></script>
  </body>
</html>
