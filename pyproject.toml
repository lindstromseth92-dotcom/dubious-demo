[project]
name = "dubious"
version = "0.1.0"
description = "Dubious: scan a web page, score each factual claim for validity and sourcing, and explain why."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "google-genai>=3.0",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "playwright>=1.49",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::SyntaxWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.uv]
package = false
